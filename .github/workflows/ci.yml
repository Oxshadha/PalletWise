# CI (engineering baseline 6). Every action is pinned by commit SHA.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  commits:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: No co-author trailers in any commit of the pull request
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          if git log --format=%B "$base..$head" | grep -qi '^co-authored-by:'; then
            echo "A commit in this pull request contains a Co-Authored-By trailer." >&2
            exit 1
          fi

  python:
    name: Python (lint, types, boundaries, tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: uv sync --frozen --all-packages
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest tests/unit -q
      - name: Integration tests (real PostgreSQL 17, roles and RLS)
        run: uv run pytest tests/integration -q
      - name: Dependency audit (third-party packages; workspace packages are not on PyPI)
        run: |
          uv export --frozen --all-packages --no-emit-workspace --format requirements-txt -o "$RUNNER_TEMP/requirements.txt"
          uv run pip-audit --strict --progress-spinner off --require-hashes --disable-pip -r "$RUNNER_TEMP/requirements.txt"

  web:
    name: Web (lint, types, tests, build, contract drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: "10.23.0"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - run: pnpm install --frozen-lockfile
      - run: uv sync --frozen --all-packages
      - name: Contract drift
        run: |
          make contracts
          git diff --exit-code -- packages/contracts
      - run: pnpm --filter @palletwise/web lint
      - run: pnpm --filter @palletwise/web typecheck
      - run: pnpm --filter @palletwise/contracts typecheck
      - run: pnpm --filter @palletwise/web test
      - run: pnpm --filter @palletwise/web build
      - run: pnpm audit --prod

  policy:
    name: OPA policy tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: open-policy-agent/setup-opa@b2b258e089860efaadaaf71bf6e3aecb4a3eeff1 # v2.4.0
        with:
          version: "1.10.1"
      - run: opa test policy -v

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.0 git /repo --redact --exit-code 1

  stack:
    name: Local stack starts healthy
    runs-on: ubuntu-latest
    needs: [python, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create .env with random development values
        run: |
          python3 - <<'EOF'
          import pathlib, secrets
          src = pathlib.Path(".env.example").read_text()
          pathlib.Path(".env").write_text("\n".join(
              l.replace("change-me", secrets.token_urlsafe(18)) for l in src.splitlines()) + "\n")
          EOF
      - name: make up (no optional credentials)
        run: make up
      - name: Site is READY through the edge
        run: curl -fsS http://localhost:8080/api/sites/current/status | grep -q '"data_status":"READY"'
      - if: failure()
        run: make logs > stack.log 2>&1 & sleep 5; cat stack.log | tail -200
