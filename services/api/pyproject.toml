[project]
name = "palletwise"
version = "0.1.0"
description = "PalletWise API and workers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary]",
  "alembic",
  "sqlalchemy",
]

[project.scripts]
palletwise-migrate = "palletwise.db.migrate:main"
palletwise-connector = "palletwise.ingest.connector:main"
palletwise-simadmin = "palletwise.simadmin.main:main"
palletwise-evaluator = "palletwise.evaluator.main:main"
palletwise-workflow = "palletwise.workflow.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletwise"]
