[project]
name = "palletwise"
version = "0.1.0"
description = "PalletWise API and workers"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pydantic-settings",
  "psycopg[binary,pool]",
  "alembic",
  "sqlalchemy",
  "pyjwt[crypto]",
  "httpx",
  "cryptography",
  "opentelemetry-api",
  "pyyaml",
  "pydantic-ai-slim[google]",
  "sse-starlette",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp-proto-http>=1.45.2",
  "prometheus-client>=0.26.0",
]

[project.scripts]
palletwise-migrate = "palletwise.db.migrate:main"
palletwise-connector = "palletwise.ingest.connector:main"
palletwise-simadmin = "palletwise.simadmin.main:main"
palletwise-evaluator = "palletwise.evaluator.main:main"
palletwise-workflow = "palletwise.workflow.main:main"
palletwise-healthcheck = "palletwise.telemetry.health:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/palletwise"]
