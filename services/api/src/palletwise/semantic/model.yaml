# Semantic model (semantic spec 2): what each measure means and how each result is explained.
# Versioned with the code. Changing a definition needs passing tests and the evaluation suite.
# "how computed" texts are shown to people: plain language, no em or en dashes.
version: 1

measures:
  on_hand:
    label: On hand
    unit: units
    how_computed: >-
      On hand is the number of units physically in a location, kept by applying every
      stock movement from the warehouse system in order.
  allocated:
    label: Allocated
    unit: units
    how_computed: >-
      Allocated is the number of units in a location reserved for open order lines.
  available:
    label: Available
    unit: units
    how_computed: >-
      Available is on hand minus allocated.
  demand_units:
    label: Units picked
    unit: units
    how_computed: >-
      Units picked for orders that were not cancelled, minus picks that were reversed.
      Shipping is not counted, so nothing is counted twice.
  days_since_last_pick:
    label: Days since last pick
    unit: days
    how_computed: >-
      Whole days since the product was last picked for an order that was not cancelled.
  stock_value:
    label: Stock value
    unit: LKR
    how_computed: >-
      Stock value is units on hand times the product's unit value.
  utilization_pct:
    label: Utilization
    unit: percent
    how_computed: >-
      Utilization is the larger of volume used and weight used, as a percentage of capacity.
      For a zone it is the total used over the total capacity of its active locations.
  shortfall:
    label: Short
    unit: units
    how_computed: >-
      Short is the units due minus the units available in the pick locations.
  days_of_cover:
    label: Days of cover
    unit: operating days
    how_computed: >-
      Days of cover is stock in pick, reserve and bulk locations divided by average daily
      demand over the last {window} operating days before today. For a category or brand it
      is total stock over total demand, not an average of products. No recent demand means no
      value.
  days_since_last_move:
    label: Days since last movement
    unit: days
    how_computed: >-
      Whole days since the product last moved in any way, including internal transfers.
  units_moved:
    label: Units moved
    unit: units
    how_computed: >-
      Units in stock movements of the chosen types in the period.
  movement_count:
    label: Movements
    unit: movements
    how_computed: >-
      Number of stock movements of the chosen types in the period.

results:
  find_product_locations:
    measures: [on_hand, allocated, available]
    how_computed: >-
      Every location holding {sku} at {as_of}. Pick, reserve and bulk locations are listed
      first, by units on hand; staging, receiving and returns locations hold stock in transit
      and are not available for orders.
  get_bin_contents:
    measures: [on_hand, allocated, available]
    how_computed: >-
      Every product in location {bin_code} at {as_of}, by units on hand, with the time of
      its last stock movement.
  get_low_stock:
    measures: [available]
    how_computed: >-
      Products with a replenishment policy whose available units in their pick location are
      at or below the policy minimum, at {as_of}. Stock in reserve does not count: the pick
      location is where orders are picked from.
  get_top_movers:
    measures: [demand_units]
    how_computed: >-
      The {limit} products with the most units picked for orders in the last {days} days up
      to {as_of}. Picks for cancelled orders do not count, and reversed picks are subtracted.
  get_dead_stock:
    measures: [days_since_last_pick, stock_value]
    how_computed: >-
      Products with stock in pick, reserve or bulk locations that have not been picked for an
      order for more than {period} days (or never), at {as_of}. Products first received less
      than {period} days ago are left out, because they are new. Largest stock value first.
  get_slow_in_prime:
    measures: [days_since_last_pick, on_hand]
    how_computed: >-
      Products not picked for an order for more than {period} days (or never) that still have
      stock in a fast-pick zone, at {as_of}. One row per fast-pick location holding them.
  get_zone_summary:
    measures: [on_hand, stock_value, utilization_pct]
    how_computed: >-
      Stock and space used in every active zone at {as_of}, zones with the most units on hand
      first.
  get_capacity_hotspots:
    measures: [utilization_pct]
    how_computed: >-
      Zones at or above {threshold} percent of their capacity, or with any location over
      capacity, at {as_of}. Highest utilization first.
  get_delayed_orders:
    measures: []
    how_computed: >-
      Open orders past their dispatch deadline at {as_of}, and orders shipped after their
      deadline since {since}.
  get_order_stockout_risks:
    measures: [shortfall]
    how_computed: >-
      For each product, the units on open order lines due {window} (overdue lines
      included) that are not yet allocated, compared with the units available in its pick
      locations, at {as_of}. A product is at risk when the units due are more than the pick
      face holds. Replenishment fixes it when reserve stock covers the shortfall; otherwise it
      is a true shortage. For replenishment before the first dispatch, the window ends at
      today's next dispatch deadline and only products a replenishment can fix are listed.
  query_inventory:
    measures: []
    how_computed: >-
      A query of {measures}{by}. Stock as of {as_of}.{period}{narrowed}
  brief_top_exceptions:
    measures: []
    how_computed: >-
      The open and acknowledged exceptions with the highest impact score at {as_of}, as the
      inbox ranks them: order lines affected, hours until due and value at risk, each scaled
      from 0 to 1 and weighted by the site settings.
  brief_throughput:
    measures: [demand_units]
    how_computed: >-
      Units picked and orders shipped on {yesterday}, the most recent operating day, compared
      with the average of the 7 operating days before it.
  brief_data_freshness:
    measures: []
    how_computed: >-
      When each data stream last synced, and how many minutes that is behind the site time
      {as_of}.

# The query language catalogue (semantic spec 7.2 and 7.3). Every measure, dimension and filter
# the DSL accepts is listed here; anything else is rejected. The compiler maps each name to one
# reviewed expression over sem objects (semantic/query.py); the two must list the same names.
query:
  dimensions:
    product: {label: Product, type: product}
    category: {label: Category, type: text}
    brand: {label: Brand, type: text}
    zone: {label: Zone, type: location}
    rack: {label: Rack, type: location}
    bin: {label: Location, type: location}
    bin_role: {label: Location type, type: text, values: [PICK, RESERVE, BULK, STAGING, RECEIVING, RETURNS]}
    customer: {label: Outlet, type: text}
    movement_type:
      label: Movement type
      type: text
      values: [RECEIPT, PUTAWAY, REPLENISH, TRANSFER, PICK, SHIP, ADJUSTMENT]
    day: {label: Day, type: time}
    week: {label: Week, type: time}
    month: {label: Month, type: time}
  measures:
    on_hand: {class: snapshot, dimensions: [product, category, brand, zone, rack, bin, bin_role]}
    allocated: {class: snapshot, dimensions: [product, category, brand, zone, rack, bin, bin_role]}
    available: {class: snapshot, dimensions: [product, category, brand, zone, rack, bin, bin_role]}
    stock_value: {class: snapshot, dimensions: [product, category, brand, zone, rack, bin, bin_role]}
    utilization_pct: {class: snapshot, dimensions: [zone, rack, bin]}
    days_of_cover: {class: snapshot, dimensions: [product, category, brand]}
    projected_days_of_cover:
      class: snapshot
      dimensions: [product, category, brand]
      available_from: the festival projection (Slice 5)
    days_since_last_pick: {class: snapshot, dimensions: [product, bin], requires: [product]}
    days_since_last_move: {class: snapshot, dimensions: [product]}
    demand_units: {class: flow, dimensions: [product, category, brand, customer, day, week, month]}
    units_moved: {class: flow, dimensions: [product, category, brand, movement_type, day, week, month]}
    movement_count: {class: flow, dimensions: [product, category, brand, movement_type, day, week, month]}
