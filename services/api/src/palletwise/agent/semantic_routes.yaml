      - Which zone has the most inventory?
      - How much stock is in each zone?
      - Which areas hold the most stock?
      - Show me the zone stock levels

  - name: capacity
    tool: get_capacity_hotspots
    arguments: {}
    synonyms: [close, capacity, full, nearly, near, space, running, out, over, overfull, hotspot,
      hotspots, room, utilization, utilisation, tight, short, zone, zones, location, locations, bin, bins]
    examples:
      - Where are we close to capacity?
      - Where are we running out of space?
      - Which zones are nearly full?
      - Show capacity hotspots
      - Which locations are over capacity?
