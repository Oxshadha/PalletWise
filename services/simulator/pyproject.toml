[project]
name = "pw-simulator"
version = "0.1.0"
description = "Simulated WMS for PalletWise (external system, reached only through the connector)"
requires-python = ">=3.13,<3.14"
dependencies = [
  "numpy",
  "psycopg[binary]",
  "fastapi",
  "uvicorn[standard]",
  "pydantic",
  "pyyaml",
]

[project.scripts]
pw-simulator = "pw_simulator.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pw_simulator"]
