# nginx site for palletwise.oshadhakariyawasam.me (certbot adds the TLS lines on first issue).
server {
    listen 80;
    listen [::]:80;
    server_name palletwise.oshadhakariyawasam.me;

    client_max_body_size 2m;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Real-IP $remote_addr;

    # Keycloak: the sign-in pages and the OpenID endpoints.
    location /auth/ {
        proxy_pass http://127.0.0.1:8180;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
    }

    # The app, the API and the live site stream (server-sent events: no buffering).
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
