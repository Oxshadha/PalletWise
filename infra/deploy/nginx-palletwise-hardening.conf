# Edge hardening for PalletWise (server context): /etc/nginx/snippets/palletwise-hardening.conf
# Included in the HTTPS server block. Needs the zones in nginx-palletwise-limits.conf.

# One HSTS and one framing policy for every response, the app's and Keycloak's.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Frame-Options;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Frame-Options "DENY" always;

# The API schema and interactive docs are for local development only.
location = /api/openapi.json { return 404; }
location ^~ /api/docs { return 404; }

# Keycloak administration is reached over an SSH tunnel to 127.0.0.1:8180, never publicly.
location ^~ /auth/admin/ { return 404; }
location ^~ /auth/realms/master/ { return 404; }

# Sign-in form posts: 5 a minute per address, short bursts allowed.
location ^~ /auth/realms/palletwise/login-actions/ {
    limit_req zone=pw_login burst=10 nodelay;
    proxy_pass http://127.0.0.1:8180;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
}

# The API: 10 requests a second per address with bursts for page loads; the live stream
# (server-sent events) is one long request.
location /api/ {
    limit_req zone=pw_api burst=60 nodelay;
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
}
