# PalletWise local stack (engineering baseline 7.1).
# Start with `make up`. Every process runs with its own database role.
# Image digests are pinned in infra/images.env and passed in by the Makefile.

name: palletwise

# One image for every Python service. Only `migrate` builds it; the others reuse it.
x-python: &python
  image: palletwise/python:dev
  pull_policy: never
  restart: unless-stopped
  environment: &db-env
    PW_DB_HOST: postgres
    PW_DB_PORT: "5432"
    PW_DB_NAME: palletwise
    # Telemetry (evals spec 9 to 13), shared by every Python process. Export is off unless an
    # OTLP endpoint or Langfuse keys are set; /metrics is served either way (API: internal 9464).
    PW_TELEMETRY_ENVIRONMENT: development
    PW_TELEMETRY_MASK_SALT: ${PW_TELEMETRY_MASK_SALT:-}
    PW_TELEMETRY_OTLP_ENDPOINT: ${PW_TELEMETRY_OTLP_ENDPOINT:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}

# Each check starts a Python process (about 0.4 s of CPU). Checks run every 3 s while a service
# starts, so `make up --wait` stays quick, then every 30 s: seven services checking every 5 s kept
# about half a CPU core busy on the developer machine.
x-health-python: &health-python
  test: ["CMD", "palletwise-healthcheck"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 180s
  start_interval: 3s

services:
  postgres:
    image: ${POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PW_BOOTSTRAP_USER}
      POSTGRES_PASSWORD: ${PW_BOOTSTRAP_PASSWORD}
      POSTGRES_DB: palletwise
    ports:
      - "127.0.0.1:${PW_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PW_BOOTSTRAP_USER} -d palletwise"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s

  migrate:
    <<: *python
    pull_policy: build
    build:
      context: ..
      dockerfile: infra/docker/python.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE}
    restart: "no"
    command: ["palletwise-migrate"]
    environment:
      <<: *db-env
      PW_BOOTSTRAP_USER: ${PW_BOOTSTRAP_USER}
      PW_BOOTSTRAP_PASSWORD: ${PW_BOOTSTRAP_PASSWORD}
      PW_MIGRATOR_USER: pw_migrator
      PW_MIGRATOR_PASSWORD: ${PW_MIGRATOR_PASSWORD}
      PW_APP_PASSWORD: ${PW_APP_PASSWORD}
      PW_INGEST_PASSWORD: ${PW_INGEST_PASSWORD}
      PW_EVALUATOR_PASSWORD: ${PW_EVALUATOR_PASSWORD}
      PW_PROPOSAL_WRITER_PASSWORD: ${PW_PROPOSAL_WRITER_PASSWORD}
      PW_WORKFLOW_PASSWORD: ${PW_WORKFLOW_PASSWORD}
      PW_SIM_ADMIN_PASSWORD: ${PW_SIM_ADMIN_PASSWORD}
      PW_AGENT_READ_PASSWORD: ${PW_AGENT_READ_PASSWORD}
      PW_MEMORY_PASSWORD: ${PW_MEMORY_PASSWORD}
      SIM_OWNER_PASSWORD: ${SIM_OWNER_PASSWORD}
      SIM_OUTBOX_READER_PASSWORD: ${SIM_OUTBOX_READER_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  simulator:
    <<: *python
    command: ["pw-simulator"]
    environment:
      <<: *db-env
      SIM_OWNER_USER: sim_owner
      SIM_OWNER_PASSWORD: ${SIM_OWNER_PASSWORD}
      SIM_DATA_DIR: /app/data/reference
    healthcheck:
      <<: *health-python
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker-connector:
    <<: *python
    command: ["palletwise-connector"]
    environment:
      <<: *db-env
      SIM_OUTBOX_READER_USER: sim_outbox_reader
      SIM_OUTBOX_READER_PASSWORD: ${SIM_OUTBOX_READER_PASSWORD}
      PW_INGEST_USER: pw_ingest
      PW_INGEST_PASSWORD: ${PW_INGEST_PASSWORD}
      PW_HEALTH_PORT: "8081"
    healthcheck:
      <<: *health-python
    depends_on:
      migrate: { condition: service_completed_successfully }
      simulator: { condition: service_healthy }

  simadmin:
    <<: *python
    command: ["palletwise-simadmin"]
    environment:
      <<: *db-env
      PW_SIM_ADMIN_USER: pw_sim_admin
      PW_SIM_ADMIN_PASSWORD: ${PW_SIM_ADMIN_PASSWORD}
      PW_SIM_CONTROL_URL: http://simulator:8000
      PW_SIM_SEED: ${PW_SIM_SEED:-42}
      PW_HEALTH_PORT: "8082"
    healthcheck:
      <<: *health-python
      # Healthy only once the initial load has finished and the site is READY.
      retries: 120
      start_period: 600s  # the full 180-day load takes about 4 minutes
    depends_on:
      migrate: { condition: service_completed_successfully }
      simulator: { condition: service_healthy }
      worker-connector: { condition: service_healthy }

  worker-evaluator:
    <<: *python
    command: ["palletwise-evaluator"]
    environment:
      <<: *db-env
      PW_EVALUATOR_USER: pw_evaluator
      PW_EVALUATOR_PASSWORD: ${PW_EVALUATOR_PASSWORD}
      PW_HEALTH_PORT: "8083"
    healthcheck:
      <<: *health-python
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker-workflow:
    <<: *python
    command: ["palletwise-workflow"]
    environment:
      <<: *db-env
      PW_WORKFLOW_USER: pw_workflow
      PW_WORKFLOW_PASSWORD: ${PW_WORKFLOW_PASSWORD}
      PW_HEALTH_PORT: "8084"
    healthcheck:
      <<: *health-python
    depends_on:
      migrate: { condition: service_completed_successfully }

  api:
    <<: *python
    command: ["uvicorn", "palletwise.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    volumes:
      # The key file stays outside the repository; /dev/null when not configured.
      - ${GCP_SA_FILE:-/dev/null}:/run/secrets/gcp-service-account.json:ro
    environment:
      <<: *db-env
      PW_APP_USER: pw_app
      PW_APP_PASSWORD: ${PW_APP_PASSWORD}
      PW_HEALTH_PATH: /api/health
      PW_PUBLIC_ORIGIN: http://localhost:${PW_EDGE_HOST_PORT:-8080}
      PW_OIDC_PUBLIC_URL: http://localhost:${PW_KEYCLOAK_HOST_PORT:-8180}/realms/palletwise
      PW_OIDC_INTERNAL_URL: http://keycloak:8080/realms/palletwise
      PW_OIDC_CLIENT_ID: palletwise-bff
      PW_OIDC_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET}
      PW_SESSION_KEYS: ${PW_SESSION_KEYS}
      PW_OPA_URL: http://opa:8181
      PW_AGENT_READ_USER: pw_agent_read
      PW_AGENT_READ_PASSWORD: ${PW_AGENT_READ_PASSWORD}
      PW_MEMORY_USER: pw_memory
      PW_MEMORY_PASSWORD: ${PW_MEMORY_PASSWORD}
      # Gemini on Vertex AI (optional). Without a project and key file the copilot uses path B.
      PW_LLM_PROJECT: ${GCP_PROJECT_ID:-}
      PW_LLM_LOCATION: ${PW_LLM_LOCATION:-global}
      PW_LLM_CREDENTIALS_FILE: /run/secrets/gcp-service-account.json
      PYDANTIC_AI_NO_BANNER: "1"
    healthcheck:
      <<: *health-python
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      keycloak: { condition: service_healthy }
      opa: { condition: service_healthy }

  keycloak:
    image: ${KEYCLOAK_IMAGE}
    restart: unless-stopped
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
      # Browsers use the public URL and tokens carry it as issuer; the API calls Keycloak
      # on the internal network, which the dynamic backchannel allows.
      KC_HOSTNAME: http://localhost:${PW_KEYCLOAK_HOST_PORT:-8180}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_DEV_MANAGER_PASSWORD: ${KC_DEV_MANAGER_PASSWORD}
      KC_DEV_ADMIN_PASSWORD: ${KC_DEV_ADMIN_PASSWORD}
      KC_BFF_CLIENT_SECRET: ${KC_BFF_CLIENT_SECRET}
      KC_COPILOT_CLIENT_SECRET: ${KC_COPILOT_CLIENT_SECRET}
    ports:
      - "127.0.0.1:${PW_KEYCLOAK_HOST_PORT:-8180}:8080"
    volumes:
      - ./keycloak/palletwise-realm.json:/opt/keycloak/data/import/palletwise-realm.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q 'UP' <&3"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s  # Keycloak imports the realm on first start
      start_interval: 3s

  opa:
    image: ${OPA_IMAGE}
    restart: unless-stopped
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--log-level=info", "/policy"]
    volumes:
      - ../policy:/policy:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8181/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s

  web:
    image: palletwise/web:dev
    build:
      context: ..
      dockerfile: infra/docker/web.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE}
        NGINX_IMAGE: ${NGINX_IMAGE}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s
    depends_on:
      api: { condition: service_healthy }

  edge:
    image: ${TRAEFIK_IMAGE}
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:8080
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --ping=true
      - --ping.entrypoint=web
    ports:
      - "127.0.0.1:${PW_EDGE_HOST_PORT:-8080}:8080"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping", "--ping.entrypoint=web", "--entrypoints.web.address=:8080"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 3s
    depends_on:
      api: { condition: service_healthy }
      web: { condition: service_healthy }

volumes:
  pgdata:
