server {
  listen 8080;
  root /usr/share/nginx/html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=()" always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

  # Build files carry a content hash: cache for a year. Logos and icons: a week.
  # (expires keeps the server-level security headers; add_header here would drop them.)
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }
  location ~* ^/(brand/|favicon\.ico$|apple-touch-icon\.png$) {
    expires 7d;
    try_files $uri =404;
  }

  location / {
    try_files $uri /index.html;
  }
}
